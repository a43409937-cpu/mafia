<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی آنلاین مافیا</title>
  <style>
    body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; text-align: center; margin: 20px; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 20px; max-width: 500px; margin: 0 auto 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, button, select { padding: 10px; margin: 5px; border-radius: 5px; border: none; font-size: 14px; }
    button { background: #e50914; color: white; cursor: pointer; font-weight: bold; }
    .hidden { display: none; }
    .player-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #333; }
    .dead { color: #888; text-decoration: line-through; }
    .role-badge { background: #007bff; color: white; padding: 2px 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🕶️ بازی مافیا آنلاین</h1>
  <div id="auth-section" class="card">
    <h3>ورود به بازی</h3>
    <input type="text" id="player-name" placeholder="نام شما">
    <br>
    <button onclick="createRoom()">ساخت اتاق جدید</button>
    <hr style="border-color: #333; margin: 15px 0;">
    <input type="text" id="room-code" placeholder="کد اتاق">
    <button onclick="joinRoom()">ورود به اتاق</button>
  </div>

  <div id="lobby-section" class="card hidden">
    <h3>اتاق: <span id="display-room-code"></span></h3>
    <h4>بازیکنان حاضر:</h4>
    <div id="player-list"></div>
    <br>
    <button id="start-btn" onclick="startGame()">شروع بازی (سازنده)</button>
  </div>

  <div id="game-section" class="card hidden">
    <h3>فاز بازی: <span id="game-phase" style="color: #ffc107;">-</span></h3>
    <p>نقش شما: <span id="user-role" class="role-badge">-</span></p>

    <div id="night-controls" class="hidden">
      <h4>اقدام شبانه</h4>
      <select id="night-target"></select>
      <button onclick="sendNightAction()">ثبت هدف</button>
      <br><br>
      <button onclick="resolveNight()">پایان فاز شب (سازنده)</button>
    </div>

    <div id="day-controls" class="hidden">
      <h4>رای‌گیری</h4>
      <select id="vote-target"></select>
      <button onclick="sendVote()">ثبت رای</button>
      <br><br>
      <button onclick="resolveVoting()">شمارش آرا (سازنده)</button>
    </div>
    <div id="logs" style="margin-top:15px; color:#aaa; font-size:13px;"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentRoom = null, myRole = null;

    function createRoom() {
      const name = document.getElementById('player-name').value;
      if (!name) return alert('نام خود را وارد کنید');
      socket.emit('create_room', { playerName: name });
    }

    function joinRoom() {
      const name = document.getElementById('player-name').value;
      const room = document.getElementById('room-code').value;
      if (!name || !room) return alert('نام و کد اتاق را وارد کنید');
      socket.emit('join_room', { roomId: room.toUpperCase(), playerName: name });
    }

    socket.on('room_created', ({ roomId, players }) => {
      currentRoom = roomId;
      showLobby(roomId, players);
    });

    socket.on('update_players', (players) => renderPlayers(players));

    socket.on('your_role', ({ role }) => {
      myRole = role;
      document.getElementById('user-role').innerText = role;
    });

    socket.on('phase_changed', ({ phase, killedId, eliminatedId, players }) => {
      document.getElementById('game-phase').innerText = phase === 'Night' ? 'شب 🌙' : 'روز ☀️';
      let logMsg = '';
      if (killedId) logMsg = `کشته شب: ${players.find(p=>p.id===killedId)?.name || 'هیچکس'}`;
      if (eliminatedId) logMsg = `اخراج با رای: ${players.find(p=>p.id===eliminatedId)?.name || 'هیچکس'}`;
      if (logMsg) document.getElementById('logs').innerHTML += `<p>${logMsg}</p>`;
      updateControls(phase);
      renderPlayers(players);
    });

    socket.on('check_result', ({ isMafia }) => alert(`استعلام: ${isMafia ? 'مافیا 🔴' : 'شهروند 🟢'}`));
    socket.on('game_over', ({ message }) => { alert(message); location.reload(); });
    socket.on('error_msg', (msg) => alert(msg));

    function showLobby(roomId, players) {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('lobby-section').classList.remove('hidden');
      document.getElementById('display-room-code').innerText = roomId;
      renderPlayers(players);
    }

    function renderPlayers(players) {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      players.forEach(p => {
        list.innerHTML += `<div class="player-item ${!p.isAlive ? 'dead' : ''}">
          <span>${p.name} ${p.id === socket.id ? '(شما)' : ''}</span>
          <span>${p.isAlive ? 'زنده' : 'حذف شده'}</span>
        </div>`;
      });
      populateDropdowns(players);
    }

    function populateDropdowns(players) {
      const aliveOthers = players.filter(p => p.isAlive && p.id !== socket.id);
      ['night-target', 'vote-target'].forEach(id => {
        const select = document.getElementById(id);
        select.innerHTML = '';
        aliveOthers.forEach(p => { select.innerHTML += `<option value="${p.id}">${p.name}</option>`; });
      });
    }

    function startGame() {
      socket.emit('start_game', { roomId: currentRoom });
      document.getElementById('lobby-section').classList.add('hidden');
      document.getElementById('game-section').classList.remove('hidden');
    }

    function updateControls(phase) {
      document.getElementById('night-controls').classList.toggle('hidden', phase !== 'Night');
      document.getElementById('day-controls').classList.toggle('hidden', phase !== 'Day');
    }

    function sendNightAction() {
      const targetId = document.getElementById('night-target').value;
      let action = 'check';
      if (myRole === 'Mafia') action = 'kill';
      if (myRole === 'Doctor') action = 'save';
      socket.emit('night_action', { roomId: currentRoom, action, targetId });
      alert('اقدام ثبت شد');
    }

    function resolveNight() { socket.emit('resolve_night', { roomId: currentRoom }); }
    function sendVote() {
      const targetId = document.getElementById('vote-target').value;
      socket.emit('cast_vote', { roomId: currentRoom, targetId });
      alert('رای ثبت شد');
    }
    function resolveVoting() { socket.emit('resolve_voting', { roomId: currentRoom }); }
  </script>
</body>
</html>
